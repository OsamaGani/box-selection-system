name: Django Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django
        run: python -m pip install "Django==6.1.2"
      - name: Run Django system check
        run: python manage.py check
      - name: Run tests
        run: python manage.py test boxes

